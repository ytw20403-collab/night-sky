<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Night Sky Dashboard Login</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:20px;
font-family:Arial,sans-serif;
color:white;
background:
radial-gradient(circle at 20% 10%,rgba(80,50,160,.30),transparent 30%),
linear-gradient(135deg,#01030a,#050918,#0b1025);
}

.box{
width:100%;
max-width:420px;
padding:35px 25px;
text-align:center;
border-radius:25px;
background:rgba(70,40,130,.20);
border:1px solid rgba(170,130,255,.35);
box-shadow:0 20px 60px rgba(0,0,0,.55);
}

.icon{
font-size:50px;
}

h1{
font-size:28px;
margin:12px 0;
}

p{
color:#aeb8d5;
}

input{
width:100%;
padding:15px;
margin-top:12px;
border-radius:12px;
border:1px solid rgba(255,255,255,.15);
background:rgba(0,0,0,.35);
color:white;
font-size:16px;
outline:none;
}

button{
width:100%;
padding:15px;
margin-top:15px;
border:0;
border-radius:30px;
background:#f5f3ff;
color:#080516;
font-size:16px;
font-weight:bold;
}

.error{
margin-top:15px;
color:#ffb8c1;
}
</style>
</head>

<body>

<div class="box">

<div class="icon">🔐</div>

<h1>Night Sky Dashboard</h1>

<p>Enter dashboard password</p>

<form method="POST">

<input
type="password"
name="password"
placeholder="Password"
required
>

<button type="submit">
🔓 Login
</button>

</form>

{% if error %}
<div class="error">{{ error }}</div>
{% endif %}

</div>

</body>
</html>
